[project]
name = "loopface-main"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipython>=9.17.1",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[project.scripts]
loopface-main = "loopface_main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
